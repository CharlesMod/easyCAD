[package]
name = "easycad"
description = "easyCAD desktop GUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "easycad_app"
path = "src/lib.rs"

[[bin]]
name = "easycad"
path = "src/main.rs"

[dependencies]
easycad-model = { path = "../model" }
easycad-sync = { path = "../sync" }
easycad-mcp = { path = "../mcp" }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.37"
egui-wgpu = "0.37"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1"
