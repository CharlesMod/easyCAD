[package]
name = "easycad-model"
description = "Document, features, sketches and file I/O for easyCAD"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glam = { version = "0.29", features = ["serde"] }
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
occt = { version = "0.1.0", path = "../occt" }
pdf-writer = "0.15.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11.1"
thiserror = "2"
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
roxmltree = "0.21.2"
tempfile = "3.27.0"
