[package]
name = "easycad-model"
description = "Document, features, sketches and file I/O for easyCAD"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
glam = { version = "0.29", features = ["serde"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils"] }
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
occt = { version = "0.1.0", path = "../occt" }
pdf-writer = "0.15.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11.1"
thiserror = "2"
tobj = { version = "4", default-features = false }
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

# Mesh booleans. Windows builds without manifold's TBB threading: MinGW GCC 12
# hits an internal compiler error compiling TBB (seh_emit_stackalloc).
[target.'cfg(not(windows))'.dependencies]
manifold-csg = "0.4.2"

[target.'cfg(windows)'.dependencies]
manifold-csg = { version = "0.4.2", default-features = false }

[dev-dependencies]
roxmltree = "0.21.2"
tempfile = "3.27.0"
