[package]
name = "casework-sync"
description = "Google Drive sync (OAuth2 + Drive v3 + local-first sync engine) for Casework"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-only"

[workspace]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "5"
globset = "0.4"
hex = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
md-5 = "0.10"
notify = "8"
open = "5"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
